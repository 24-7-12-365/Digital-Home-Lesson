<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online School</title>
    <link rel="stylesheet" href="styles.css"> <!-- Assuming an external CSS file -->
</head>
<body>
    <header>
        <nav>
            <ul id="navLinks">
                <li><a href="home.html">Home</a></li>
                <li id="roleSpecific"></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Welcome to the Online School</h1>
        <div id="authForm">
            <h2>Login</h2>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Login</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Online School</p>
    </footer>

    <script>
        // Example JavaScript for role-based navigation
        const userRole = 'student'; // This could be dynamically set based on login
        const roleSpecificNav = document.getElementById('roleSpecific');

        if (userRole === 'admin') {
            roleSpecificNav.innerHTML = '<a href="admin.html">Admin Panel</a>';
        } else if (userRole === 'teacher') {
            roleSpecificNav.innerHTML = '<a href="teacher.html">Teacher Dashboard</a>';
        } else {
            roleSpecificNav.innerHTML = '<a href="courses.html">Courses</a>';
        }
    </script>
</body>
</html>
