<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online School App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📘 Online School System</h1>

<!-- AUTH SECTION -->
<div id="auth-section">
  <h2>Sign Up</h2>
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="email" placeholder="Email or Phone">
  <input type="password" id="password" placeholder="Password">

  <select id="role">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
  </select>

  <input type="text" id="class" placeholder="Class">
  <input type="text" id="subjects" placeholder="Subjects (comma separated)">

  <button onclick="signUp()">Sign Up</button>

  <h2>Login</h2>
  <input type="text" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARDS -->
<div id="admin-dashboard" class="dashboard hidden">
  <h2>Admin Dashboard</h2>
  <div id="pending-users"></div>
</div>

<div id="teacher-dashboard" class="dashboard hidden">
  <h2>Teacher Dashboard</h2>

  <select id="teacher-subject"></select>
  <select id="teacher-week">
    <option>Week 1</option>
    <option>Week 2</option>
  </select>

  <textarea id="lesson-note" placeholder="Lesson note"></textarea>
  <input type="text" id="video-link" placeholder="Video link">
  <input type="file" id="image-upload">

  <textarea id="obj-questions" placeholder="Objective Questions (JSON format)"></textarea>
  <textarea id="theory-questions" placeholder="Theory Questions"></textarea>

  <button onclick="saveLesson()">Save Lesson</button>

  <div id="student-scores"></div>
</div>

<div id="student-dashboard" class="dashboard hidden">
  <h2>Student Dashboard</h2>

  <select id="student-subject"></select>
  <select id="student-week">
    <option>Week 1</option>
    <option>Week 2</option>
  </select>

  <button onclick="loadLesson()">Load Lesson</button>

  <div id="lesson-display"></div>
  <div id="video-display"></div>

  <div id="cbt-section"></div>

  <textarea id="student-question" placeholder="Ask question"></textarea>
  <button onclick="submitQuestion()">Ask</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
